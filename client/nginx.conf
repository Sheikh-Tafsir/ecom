server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Production logs
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log notice;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # TODO: CSP below contains localhost:8080 for local dev. For production, replace with actual
    # gateway domain and restrict ws:/wss: to specific hosts instead of allowing any origin.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://accounts.google.com; worker-src 'self' blob:; child-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' https://res.cloudinary.com https://images.unsplash.com https://img.freepik.com data: blob:; connect-src 'self' http://localhost:8080 ws: wss: https://accounts.google.com; frame-src 'self' https://accounts.google.com; object-src 'none'; base-uri 'self';" always;

    # Root and index
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle static assets with aggressive caching
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|eot|ttf|otf|webp)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
