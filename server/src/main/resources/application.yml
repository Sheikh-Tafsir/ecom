app:
  cache:
    strategy: ${APP_CACHE_STRATEGY:redis}
    ttl:
      default-minutes: 5
      idempotency-minutes: 60
      otp-minutes: 5
      sse-ticket-minutes: 1
      cms-minutes: 10
      token-rotation-seconds: 60

  standalone: false

spring:
  application:
    name: ecom

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 30MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties.hibernate.hibernate.format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  rabbitmq:
    host: ${MQ_HOST}
    port: ${MQ_PORT}
    username: ${MQ_USERNAME}
    password: ${MQ_PASSWORD}
    listener:
      simple:
        retry:
          enabled: true
          initial-interval: 2000
          max-retries: 3

    mail:
      queue: mail.queue
      exchange: mail.exchange
      routing-key: mail.send

    service:
      queue: service.queue
      exchange: service.exchange
      routing-key: service.routing.key

  http:
    converters:
      preferred-json-mapper: jackson

cors.allowed.origins: ${CORS_ALLOWED_ORIGINS}

server.port: ${SERVER_PORT}

logging:
  level:
    root: INFO
    com.example.ecom: DEBUG
    org.springframework.security: DEBUG
    org.springframework.web.multipart: DEBUG

  pattern.console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [Req: %X{requestId}, IP: %X{clientIp}, UserId: %X{userId}] - %msg%n'

jwt:
  access-token:
    expiration: 900 # 15 minutes
    secret: ${ACCESS_TOKEN_SECRET}
  refresh-token:
    expiration: 604800 # 7 days
    secret: ${REFRESH_TOKEN_SECRET}
  sse-token:
    expiration: 60 # 1 minute

access:
  token:
    value: ${ACCESS_TOKEN_SECRET}
    validity: 900

refresh:
  token:
    name: ${REFRESH_TOKEN_NAME}
    value: ${REFRESH_TOKEN_SECRET}
    validity: 604800 # 7 days in seconds

cloudinary:
  cloud:
    name: ${CLOUDINARY_CLOUD_NAME:}
  api:
    key: ${CLOUDINARY_API_KEY:}
    secret: ${CLOUDINARY_API_SECRET:}
  folder: ${CLOUDINARY_FOLDER:chat-images}

supabase:
  url: ${SUPABASE_URL:}
  api-key: ${SUPABASE_API_KEY:}
  bucket: ${SUPABASE_BUCKET:images}

mail:
  smtp:
    host: ${MAIL_SMTP_HOST:smtp.gmail.com}
    port: ${MAIL_SMTP_PORT:587}
    username: ${MAIL_SMTP_USERNAME:}
    password: ${MAIL_SMTP_PASSWORD:}

service:
  queue: service.queue
  exchange: service.exchange
  routing-key: service.events.#

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always

  prometheus:
    metrics:
      export:
        enabled: true

springdoc:
  api-docs.path: /v3/api-docs
  swagger-ui:
    enabled: true
    url: /v3/api-docs
    path: /swagger-ui.html
    operations-sorter: method

bkash:
  base-url: ${BKASH_BASE_URL}
  app-key: ${BKASH_APP_KEY}
  app-secret: ${BKASH_APP_SECRET}
  username: ${BKASH_USERNAME}
  password: ${BKASH_PASSWORD}
  callback-url: ${SERVER_URL}/api/payments/bkash/callback
  frontend-success-url: ${CLIENT_URL}/payment-success
  frontend-fail-url: ${CLIENT_URL}/payment-failed

rate-limit:
  global:
    rate: 2000
    concurrency: 100
  ip:
    rate: 100
    concurrency: 20
  auth-ip:
    rate: 20
    concurrency: 5
  user:
    rate: 300
    concurrency: 15
  otp:
    rate: 1
    window-seconds: 60
    max-tries: 3
    validity-minutes: 5
  window-seconds: 60

