app:
  cache:
    strategy: local  # Use Caffeine for tests to avoid needing Redis

spring:
  profiles:
    active: test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false  # Speed up tests by using Hibernate ddl-auto for schema

  rabbitmq:
    host: localhost
    port: 5672
    mail:
      queue: mail.queue
      exchange: mail.exchange
      routing-key: mail.send
    service:
      queue: service.queue
      exchange: service.exchange
      routing-key: service.routing.key
    listener:
      simple:
        auto-startup: false

mail:
  smtp:
    host: localhost
    port: 25
    username: test
    password: test

