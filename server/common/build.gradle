plugins {
    id 'java-library'
}

dependencies {
    api project(':contracts')

    api 'org.springframework.boot:spring-boot-starter'
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-webflux'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-cache'
    api 'org.springframework.boot:spring-boot-starter-data-redis'
    api 'org.springframework.boot:spring-boot-starter-aop'
    api 'org.springframework.boot:spring-boot-starter-json'
    api 'org.springframework.boot:spring-boot-starter-mail'
    api 'org.springframework.boot:spring-boot-starter-amqp'
    api 'org.springframework.boot:spring-boot-starter-actuator'

    api 'com.github.ben-manes.caffeine:caffeine'
    api 'commons-codec:commons-codec:1.16.1'
    api 'com.giffing.bucket4j.spring.boot.starter:bucket4j-spring-boot-starter:0.12.0'
    api 'com.bucket4j:bucket4j-redis:8.10.1'
    api 'redis.clients:jedis:5.1.0'
    api 'org.modelmapper:modelmapper:3.1.1'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    api 'net.logstash.logback:logstash-logback-encoder:8.0'
    api 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    api 'com.cloudinary:cloudinary-http44:1.39.0'
    api 'org.apache.tika:tika-core:3.2.2'
    api 'org.jsoup:jsoup:1.17.2'
    api 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.13'
    api 'io.micrometer:micrometer-registry-prometheus'
    api 'org.springframework.cloud:spring-cloud-context'
    api 'org.springframework.retry:spring-retry'
}
