# Nginx reverse proxy — single entry point for the entire application.
# Routes static files to the client container and API/WebSocket traffic to the gateway.

upstream client_upstream {
    server client:80;
}

upstream gateway_upstream {
    server gateway:8080;
}

# HTTP -> redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # --- Security headers (defense-in-depth for API responses) ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # --- All REST API routes -> Gateway ---
    location /api/ {
        proxy_pass http://gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket support (for socket.io) -> Gateway ---
    location /socket.io/ {
        proxy_pass http://gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-polling/WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Actuator: only health endpoint (for external monitoring) ---
    location = /actuator/health {
        proxy_pass http://gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Block all other actuator, swagger, and API docs from public access ---
    location ~ ^/(actuator|swagger-ui|v3|chats/v3) {
        return 404;
    }

    # --- Everything else -> Client (React SPA) ---
    location / {
        proxy_pass http://client_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
