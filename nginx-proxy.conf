# Nginx reverse proxy — single entry point for the entire application.
# Routes static files to the client container and API/WebSocket traffic to the gateway.

upstream client_upstream {
    server client:80;
}

upstream gateway_upstream {
    server gateway:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # --- All REST API routes -> Gateway ---
    location /api/ {
        proxy_pass http://gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- WebSocket support (for socket.io) -> Gateway ---
    location /socket.io/ {
        proxy_pass http://gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts for long-polling/WebSocket
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --- Developer docs & actuator -> Gateway ---
    location ~ ^/(swagger-ui|v3|chats/v3|actuator) {
        proxy_pass http://gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Everything else -> Client (React SPA) ---
    location / {
        proxy_pass http://client_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
