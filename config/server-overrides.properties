# ==============================================================================
# Dynamic Runtime Overrides (Hot-Reloadable via POST /actuator/refresh)
# ==============================================================================

# Rate Limiting & Concurrency Throttles
rate-limit.global.rate=2000
rate-limit.global.concurrency=100
rate-limit.ip.rate=100
rate-limit.ip.concurrency=20
rate-limit.auth-ip.rate=20
rate-limit.auth-ip.concurrency=5
rate-limit.user.rate=300
rate-limit.user.concurrency=15
rate-limit.window-seconds=60

# OTP Throttles & Limits
rate-limit.otp.rate=1
rate-limit.otp.window-seconds=60
rate-limit.otp.max-tries=3

# Content & Business Limits
app.product.max-image-count=5
app.cms.max-total-banners=20
app.cms.max-active-banners=5
app.cms.max-total-faqs=10
app.upload.max-file-size-bytes=5242880
