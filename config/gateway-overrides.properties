# Rate Limiting & Concurrency Throttles
rate-limit.global.rate=2000
rate-limit.global.concurrency=100
rate-limit.ip.rate=100
rate-limit.ip.concurrency=20
rate-limit.auth-ip.rate=20
rate-limit.auth-ip.concurrency=5
rate-limit.user.rate=300
rate-limit.user.concurrency=15
rate-limit.window-seconds=60
