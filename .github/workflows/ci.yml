name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  server-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build & Test Server
        working-directory: ./server
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Build & Test Gateway
        working-directory: ./gateway
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install & Build Client
        working-directory: ./client
        run: |
          npm ci --legacy-peer-deps
          npm run build

  chat-server-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server_chat/package-lock.json
      - name: Install Chat Server
        working-directory: ./server_chat
        run: npm ci

  docker-build:
    runs-on: ubuntu-latest
    needs: [server-build, client-build, chat-server-build]
    steps:
      - uses: actions/checkout@v4
      - name: Create minimal .env for docker compose build
        run: |
          cat > .env << 'EOF'
          DB_NAME=ecom
          DB_USERNAME=postgres
          DB_PASSWORD=dummy
          DB_URL=jdbc:postgresql://postgres:5432/ecom
          DB_DRIVER_CLASS=org.postgresql.Driver
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=dummy
          MQ_HOST=rabbitmq
          MQ_PORT=5672
          MQ_USERNAME=guest
          MQ_PASSWORD=guest
          ACCESS_TOKEN_SECRET=dummy-ci-secret-key-at-least-32-characters-long
          REFRESH_TOKEN_SECRET=dummy-ci-secret
          REFRESH_TOKEN_NAME=refreshToken
          GATEWAY_PORT=8080
          MAIN_SERVER_PORT=8081
          CHAT_SERVER_PORT=3001
          CLIENT_PORT=80
          CLIENT_URL=http://localhost
          SERVER_URL=http://localhost:8080
          CORS_ALLOWED_ORIGINS=http://localhost
          MAIN_SERVICE_URL=http://server:8081
          CHAT_SERVICE_URL=http://chat-server:3001
          CHAT_SERVICE_WS_URL=ws://chat-server:3001
          BACKUP_DB_HOST=postgres
          BACKUP_DB_NAME=ecom
          GDRIVE_SYNC_ENABLED=false
          DEPLOYMENT_ENVIRONMENT=dev
          ACCESS_TOKEN=dummy
          LOCAL_STORAGE_CART_KEY=cart
          WEB_SOCKET_ON=true
          SSE_ON=true
          GOOGLE_LOGIN_CLIENT_ID=dummy
          APP_CACHE_STRATEGY=NONE
          MAIL_SMTP_HOST=smtp.example.com
          MAIL_SMTP_PORT=587
          MAIL_SMTP_USERNAME=dummy
          MAIL_SMTP_PASSWORD=dummy
          CLOUDINARY_CLOUD_NAME=dummy
          CLOUDINARY_API_KEY=dummy
          CLOUDINARY_API_SECRET=dummy
          SUPABASE_URL=https://dummy.supabase.co
          SUPABASE_API_KEY=dummy
          SUPABASE_BUCKET=dummy
          BKASH_BASE_URL=https://dummy.bka.sh
          BKASH_APP_KEY=dummy
          BKASH_APP_SECRET=dummy
          BKASH_USERNAME=dummy
          BKASH_PASSWORD=dummy
          EOF
      - name: Build Docker images
        run: docker compose build

  deploy:
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy application
        run: |
          echo "Triggering deployment pipeline for ${{ github.ref_name }} branch..."
          # Insert server deployment commands / webhook / image push here

