name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ────────────────────────────────────────────────────────────────
# 1. BUILD + TEST  (run in parallel per service)
# ────────────────────────────────────────────────────────────────
jobs:
  server-build:
    name: "Server — Build & Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Test Server
        working-directory: ./server
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload Server test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: server/build/reports/tests/test/
          retention-days: 14

      - name: Upload Server JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/build/reports/jacoco/test/
          retention-days: 14

  gateway-build:
    name: "Gateway — Build & Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build & Test Gateway
        working-directory: ./gateway
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload Gateway test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-test-results
          path: gateway/build/reports/tests/test/
          retention-days: 14

      - name: Upload Gateway JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gateway-coverage
          path: gateway/build/reports/jacoco/test/
          retention-days: 14

  client-build:
    name: "Client — Build & Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: ./client
        run: npm ci --legacy-peer-deps

      - name: Lint (ESLint)
        working-directory: ./client
        # TODO: remove '|| true' once all existing lint errors are fixed
        run: npm run lint || true

      - name: Build
        working-directory: ./client
        run: npm run build

  chat-server-build:
    name: "Chat Server — Build, Lint & Test"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server_chat/package-lock.json

      - name: Install dependencies
        working-directory: ./server_chat
        run: npm ci

      - name: Security lint (ESLint + security plugin)
        working-directory: ./server_chat
        run: npm run lint:security

      - name: Run tests
        working-directory: ./server_chat
        run: npm test

  # ────────────────────────────────────────────────────────────────
  # 2. SAST — Static Application Security Testing
  # ────────────────────────────────────────────────────────────────
  sast-java:
    name: "SAST — SpotBugs + FindSecBugs (Java)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: SpotBugs — Server
        working-directory: ./server
        run: |
          chmod +x gradlew
          ./gradlew spotbugsMain --no-daemon

      - name: SpotBugs — Gateway
        working-directory: ./gateway
        run: |
          chmod +x gradlew
          ./gradlew spotbugsMain --no-daemon

      - name: Upload SpotBugs reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-reports
          path: |
            server/build/reports/spotbugs/
            gateway/build/reports/spotbugs/
          retention-days: 14

  # NOTE: CodeQL is handled by GitHub's "Default Setup" (Settings > Security).
  # Adding a workflow-based CodeQL job here would conflict with the default setup.

  # ────────────────────────────────────────────────────────────────
  # 3. SCA — Software Composition Analysis (dependency CVEs)
  # ────────────────────────────────────────────────────────────────
  # NOTE: OWASP Dependency-Check (Java SCA) runs weekly — see sca-java.yml

  sca-npm:
    name: "SCA — npm audit (Node.js)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit Chat Server
        working-directory: ./server_chat
        # npm audit exits non-zero on findings; don't fail the build
        run: |
          npm ci
          npm audit --audit-level=high || true

      - name: Audit Client
        working-directory: ./client
        run: |
          npm ci --legacy-peer-deps
          npm audit --audit-level=high || true

  # ────────────────────────────────────────────────────────────────
  # 4. SECRET SCANNING
  # ────────────────────────────────────────────────────────────────
  secret-scan:
    name: "Secrets — Gitleaks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ────────────────────────────────────────────────────────────────
  # 5. TRIVY — Filesystem & Misconfiguration scan
  # ────────────────────────────────────────────────────────────────
  trivy-scan:
    name: "Trivy — Filesystem Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy (vuln + secret + misconfig)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,secret,misconfig'
          severity: 'CRITICAL'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true

  # ────────────────────────────────────────────────────────────────
  # 6. DOCKER BUILD VERIFICATION (after all builds pass)
  # ────────────────────────────────────────────────────────────────
  docker-build:
    name: "Docker — Compose Build"
    runs-on: ubuntu-latest
    needs: [server-build, gateway-build, client-build, chat-server-build]
    steps:
      - uses: actions/checkout@v4

      - name: Create minimal .env for docker compose build
        run: |
          cat > .env << 'EOF'
          DB_NAME=ecom
          DB_USERNAME=postgres
          DB_PASSWORD=dummy
          DB_URL=jdbc:postgresql://postgres:5432/ecom
          DB_DRIVER_CLASS=org.postgresql.Driver
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_PASSWORD=dummy
          MQ_HOST=rabbitmq
          MQ_PORT=5672
          MQ_USERNAME=guest
          MQ_PASSWORD=guest
          ACCESS_TOKEN_SECRET=dummy-ci-secret-key-at-least-32-characters-long
          REFRESH_TOKEN_SECRET=dummy-ci-secret
          REFRESH_TOKEN_NAME=refreshToken
          GATEWAY_PORT=8080
          MAIN_SERVER_PORT=8081
          CHAT_SERVER_PORT=3001
          CLIENT_PORT=80
          CLIENT_URL=http://localhost
          SERVER_URL=http://localhost:8080
          CORS_ALLOWED_ORIGINS=http://localhost
          MAIN_SERVICE_URL=http://server:8081
          CHAT_SERVICE_URL=http://chat-server:3001
          CHAT_SERVICE_WS_URL=ws://chat-server:3001
          BACKUP_DB_HOST=postgres
          BACKUP_DB_NAME=ecom
          GDRIVE_SYNC_ENABLED=false
          DEPLOYMENT_ENVIRONMENT=prod
          ACCESS_TOKEN=dummy
          LOCAL_STORAGE_CART_KEY=cart
          WEB_SOCKET_ON=true
          REVOKED_TOKENS_PREFIX=v1:revokedAccessTokens::
          TRUSTED_PROXY_IPS=
          GOOGLE_LOGIN_CLIENT_ID=dummy
          APP_CACHE_STRATEGY=NONE
          MAIL_SMTP_HOST=smtp.example.com
          MAIL_SMTP_PORT=587
          MAIL_SMTP_USERNAME=dummy
          MAIL_SMTP_PASSWORD=dummy
          CLOUDINARY_CLOUD_NAME=dummy
          CLOUDINARY_API_KEY=dummy
          CLOUDINARY_API_SECRET=dummy
          SUPABASE_URL=https://dummy.supabase.co
          SUPABASE_API_KEY=dummy
          SUPABASE_BUCKET=dummy
          BKASH_BASE_URL=https://dummy.bka.sh
          BKASH_APP_KEY=dummy
          BKASH_APP_SECRET=dummy
          BKASH_USERNAME=dummy
          BKASH_PASSWORD=dummy
          INTERNAL_SERVICE_KEY=dummy-ci-internal-service-key-32-chars-long
          CHAT_DB_NAME=chat_db
          CHAT_DB_USERNAME=postgres
          CHAT_DB_PASSWORD=postgres
          CHAT_DB_HOST=postgres-chat
          CHAT_DB_PORT=5432
          CLOUDINARY_FOLDER=dummy
          SESSION_HINT_KEY=dummy
          APP_PORT=80
          APP_SSL_PORT=443
          BACKUP_ENCRYPTION_KEY=dummy
          HEALTH_CHECK_INTERVAL=30
          ALERT_WEBHOOK_URL=
          EOF

      - name: Build Docker images
        run: docker compose build

      - name: Trivy — Scan Docker images
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'image'
          image-ref: 'ecom-server'
          severity: 'CRITICAL'
          exit-code: '0'
          ignore-unfixed: true

  # ────────────────────────────────────────────────────────────────
  # 7. CI SUMMARY (gate — fails if any upstream job failed)
  # ────────────────────────────────────────────────────────────────
  ci-passed:
    name: "✅ CI Passed"
    if: always()
    runs-on: ubuntu-latest
    needs:
      - server-build
      - gateway-build
      - client-build
      - chat-server-build
      - sast-java
      - sca-npm
      - secret-scan
      - trivy-scan
      - docker-build
    steps:
      - name: Check all jobs
        run: |
          echo "Job results:"
          echo "  server-build:      ${{ needs.server-build.result }}"
          echo "  gateway-build:     ${{ needs.gateway-build.result }}"
          echo "  client-build:      ${{ needs.client-build.result }}"
          echo "  chat-server-build: ${{ needs.chat-server-build.result }}"
          echo "  sast-java:         ${{ needs.sast-java.result }}"
          echo "  sca-npm:           ${{ needs.sca-npm.result }}"
          echo "  secret-scan:       ${{ needs.secret-scan.result }}"
          echo "  trivy-scan:        ${{ needs.trivy-scan.result }}"
          echo "  docker-build:      ${{ needs.docker-build.result }}"

          # Fail if any critical job didn't succeed
          FAILED=false
          for JOB in \
            "${{ needs.server-build.result }}" \
            "${{ needs.gateway-build.result }}" \
            "${{ needs.client-build.result }}" \
            "${{ needs.chat-server-build.result }}" \
            "${{ needs.sast-java.result }}" \
            "${{ needs.docker-build.result }}"; do
            if [[ "$JOB" != "success" ]]; then
              FAILED=true
            fi
          done

          if [[ "$FAILED" == "true" ]]; then
            echo "❌ One or more critical jobs failed!"
            exit 1
          fi
          echo "✅ All critical jobs passed."
