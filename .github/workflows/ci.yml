name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  server-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build & Test Server
        working-directory: ./server
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon
      - name: Build & Test Gateway
        working-directory: ./gateway
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

  client-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - name: Install & Build Client
        working-directory: ./client
        run: |
          npm ci --legacy-peer-deps
          npm run build

  chat-server-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: server_chat/package-lock.json
      - name: Install Chat Server
        working-directory: ./server_chat
        run: npm ci

  docker-build:
    runs-on: ubuntu-latest
    needs: [server-build, client-build, chat-server-build]
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
