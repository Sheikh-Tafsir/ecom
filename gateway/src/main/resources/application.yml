spring:
  application:
    name: gateway

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  http:
    codecs:
      max-in-memory-size: 2MB

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 10s
          routes:
            - id: chat-service-ws
              uri: ${CHAT_SERVICE_WS_URL:ws://chat-server:3001}
              predicates:
                - Path=/socket.io/**

            - id: chat-service
              uri: ${CHAT_SERVICE_URL}
              predicates:
                - Path=/chats/**

            - id: main-service
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: mainServiceCB
                - name: Retry
                  args:
                    retries: 2
                    methods: GET
                    statuses: SERVICE_UNAVAILABLE

server:
  port: ${GATEWAY_PORT}

cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS}

rate-limit:
  global:
    rate: 2000
    concurrency: 100
  ip:
    rate: 100
    concurrency: 20
  auth-ip:
    rate: 20
    concurrency: 5
  user:
    rate: 300
    concurrency: 15
  window-seconds: 60
  trusted-proxies: ${TRUSTED_PROXY_IPS:}

access:
  token:
    value: ${ACCESS_TOKEN_SECRET}

logging:
  level:
    root: INFO
    org.springframework.security: WARN
    org.springframework.cloud.gateway: INFO
    org.springframework.security.oauth2: WARN
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [Req: %X{requestId}, IP: %X{clientIp}, UserId: %X{userId}] - %msg%n'

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    urls:
      - name: Core Service
        url: /v3/api-docs
      - name: Chat Service
        url: /chats/v3/api-docs
  api-docs:
    enabled: true

app:
  cache:
    revoked-tokens-prefix: ${REVOKED_TOKENS_PREFIX:v1:revokedAccessTokens::}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
  timelimiter:
    configs:
      default:
        timeoutDuration: 10s