spring:
  application:
    name: gateway

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: chat-service-ws
              uri: ${CHAT_SERVICE_WS_URL:ws://chat-server:3001}
              predicates:
                - Path=/socket.io/**

            - id: chat-service
              uri: ${CHAT_SERVICE_URL}
              predicates:
                - Path=/chats/**

            - id: main-service
              uri: ${MAIN_SERVICE_URL}
              predicates:
                - Path=/**

server:
  port: ${GATEWAY_PORT}

cors:
  allowed:
    origins: ${CORS_ALLOWED_ORIGINS}

rate-limit:
  global:
    rate: 2000
    concurrency: 100
  ip:
    rate: 100
    concurrency: 20
  auth-ip:
    rate: 20
    concurrency: 5
  user:
    rate: 300
    concurrency: 15
  window-seconds: 60

access:
  token:
    value: ${ACCESS_TOKEN_SECRET}

logging:
  level:
    root: INFO
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security.oauth2: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - [Req: %X{requestId}, IP: %X{clientIp}, UserId: %X{userId}] - %msg%n'

springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operationsSorter: method
    urls:
      - name: Core Service
        url: /v3/api-docs
      - name: Chat Service
        url: /chats/v3/api-docs
  api-docs:
    enabled: true

app:
  cache:
    revoked-tokens-prefix: ${REVOKED_TOKENS_PREFIX:v1:revokedAccessTokens::}